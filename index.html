<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha's Club Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #1100FF;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--blue);
            color: var(--white);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR GAUCHE (Réglages) --- */
        .sidebar {
            width: 320px;
            background-color: var(--blue);
            border-right: 2px solid var(--white);
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--white); }

        .section-title {
            background-color: var(--white);
            color: var(--blue);
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }

        label {
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], select {
            padding: 6px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 3px;
            color: var(--white);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        
        input[type="text"]:focus, select:focus {
            border-color: var(--white);
        }
        
        input[type="color"] {
            padding: 2px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 3px;
            width: 100%;
            height: 35px;
            cursor: pointer;
            box-sizing: border-box;
        }

        select option {
            background-color: var(--blue);
            color: var(--white);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            background: var(--white);
            cursor: pointer;
            margin-top: -4px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 3px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
        }

        .btn-toggle {
            background-color: transparent;
            color: var(--white);
            border: 1px solid var(--white);
            padding: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
        }
        .btn-toggle:hover {
            background-color: var(--white);
            color: var(--blue);
        }

        /* --- CONTENU PRINCIPAL DROITE --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
        }

        .site-title {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .canvas-container {
            margin-bottom: 30px;
        }

        canvas {
            background-color: var(--white);
            border: 2px solid var(--white);
            max-width: 100%;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        /* --- BARRE D'ACTIONS --- */
        .action-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .action-group {
            display: flex;
            gap: 5px;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 15px;
        }

        .action-group:last-child { border: none; padding-right: 0; }

        .btn-primary {
            background-color: var(--white);
            color: var(--blue);
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.95); }

        .btn-vasy {
            background-color: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-vasy:hover {
            background-color: var(--white);
            color: var(--blue);
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <!-- Base -->
        <div>
            <div class="section-title">Base</div>
            <div class="control-group">
                <label>Texte</label>
                <input type="text" id="textInput" value="gAvTyG5" maxlength="8">
            </div>
            <div class="control-group">
                <label>Police Google</label>
                <select id="fontStyle">
                    <option value="MIXED">⚡ Mélange de polices (Aléatoire)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Couleur du texte</label>
                <input type="color" id="textColor" value="#1100FF">
            </div>
            <div class="control-group">
                <button class="btn-toggle" id="toggleStyleBtn">Style : Rempli</button>
            </div>
        </div>

        <!-- Positionnement -->
        <div>
            <div class="section-title">Positionnement</div>
            <div class="control-group"><label>Position X</label><input type="range" id="posX" min="-100" max="100" value="0"></div>
            <div class="control-group"><label>Position Y</label><input type="range" id="posY" min="-50" max="50" value="0"></div>
            <div class="control-group"><label>Espacement Lettres</label><input type="range" id="letterSpacing" min="-10" max="40" value="5"></div>
        </div>

        <!-- Distorsion -->
        <div>
            <div class="section-title">Distorsion & Étirement</div>
            <div class="control-group"><label>Échelle Globale</label><input type="range" id="scale" min="0.5" max="2.0" step="0.1" value="1.0"></div>
            <div class="control-group"><label>Étirer Largeur (X)</label><input type="range" id="scaleX" min="0.5" max="2.0" step="0.1" value="1.0"></div>
            <div class="control-group"><label>Étirer Hauteur (Y)</label><input type="range" id="scaleY" min="0.5" max="2.0" step="0.1" value="1.0"></div>
            <div class="control-group"><label>Inclinaison H (Skew X)</label><input type="range" id="skewX" min="-1.0" max="1.0" step="0.1" value="0.0"></div>
            <div class="control-group"><label>Inclinaison V (Skew Y)</label><input type="range" id="skewY" min="-0.5" max="0.5" step="0.1" value="0.0"></div>
        </div>

        <!-- Chaos & Effets -->
        <div>
            <div class="section-title">Chaos & Effets</div>
            <div class="control-group"><label>Rotation Aléatoire</label><input type="range" id="randomRot" min="0" max="45" value="5"></div>
            <div class="control-group"><label>Amplitude Vague</label><input type="range" id="waveAmp" min="0" max="30" value="5"></div>
            <div class="control-group"><label>Fréquence Vague</label><input type="range" id="waveFreq" min="0" max="3" step="0.1" value="1.0"></div>
            <div class="control-group"><label>Flou (Blur)</label><input type="range" id="blur" min="0" max="5" step="0.5" value="0"></div>
        </div>
    </aside>

    <main class="main-content">
        <h1 class="site-title">captcha's club</h1>
        
        <div class="canvas-container">
            <canvas id="captchaCanvas" width="500" height="180"></canvas>
        </div>

        <div class="action-bar">
            <div class="action-group">
                <select id="exportFormat" style="width: auto; padding: 10px;">
                    <option value="png">PNG (Transparent)</option>
                    <option value="jpeg">JPEG (Fond Blanc)</option>
                </select>
                <button class="btn-primary" id="exportBtn">Exporter</button>
            </div>
            <div class="action-group">
                <button class="btn-vasy" id="randomBtn">Vas-y 🎲</button>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        let useStroke = false;

        const googleFonts = [
            "VT323", "Inter", "Roboto", "Montserrat", "Oswald", "Playfair Display", 
            "Bebas Neue", "Dancing Script", "Pacifico", "Anton", "Righteous", 
            "Lobster", "Creepster", "Special Elite", "Monoton", "Orbitron", "Nosifer",
            "Shadows Into Light", "Amatic SC", "Indie Flower", "Caveat"
        ];

        const fontSelect = document.getElementById('fontStyle');
        googleFonts.forEach(font => {
            let option = document.createElement('option');
            option.value = font;
            option.textContent = font;
            fontSelect.appendChild(option);
        });

        function loadGoogleFont(fontName, callback) {
            const fontId = 'font-' + fontName.replace(/\s+/g, '-').toLowerCase();
            if (!document.getElementById(fontId)) {
                const link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}&display=swap`;
                document.head.appendChild(link);
                document.fonts.load(`16px "${fontName}"`).then(() => callback());
            } else {
                callback();
            }
        }

        function loadAllFonts(callback) {
            let loaded = 0;
            googleFonts.forEach(font => {
                loadGoogleFont(font, () => {
                    loaded++;
                    if(loaded === googleFonts.length && callback) callback();
                });
            });
        }

        function renderCaptcha() {
            const text = document.getElementById('textInput').value || " ";
            const selectedFont = document.getElementById('fontStyle').value;
            const textColor = document.getElementById('textColor').value;
            
            const posX = parseFloat(document.getElementById('posX').value);
            const posY = parseFloat(document.getElementById('posY').value);
            const letterSpacing = parseFloat(document.getElementById('letterSpacing').value);
            
            const scale = parseFloat(document.getElementById('scale').value);
            const scaleX = parseFloat(document.getElementById('scaleX').value);
            const scaleY = parseFloat(document.getElementById('scaleY').value);
            const skewX = parseFloat(document.getElementById('skewX').value);
            const skewY = parseFloat(document.getElementById('skewY').value);
            
            const randomRot = parseFloat(document.getElementById('randomRot').value);
            const waveAmp = parseFloat(document.getElementById('waveAmp').value);
            const waveFreq = parseFloat(document.getElementById('waveFreq').value);
            const blur = parseFloat(document.getElementById('blur').value);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.filter = `blur(${blur}px)`;

            const fontSize = 60 * scale; // Un peu plus grand de base pour la lisibilité

            let letterFonts = [];
            for(let i = 0; i < text.length; i++) {
                if (selectedFont === "MIXED") {
                    let randFont = googleFonts[Math.floor(Math.random() * googleFonts.length)];
                    letterFonts.push(randFont);
                } else {
                    letterFonts.push(selectedFont);
                }
            }

            ctx.save();
            let totalWidth = 0;
            let charWidths = [];
            for(let i = 0; i < text.length; i++) {
                ctx.font = `bold ${fontSize}px "${letterFonts[i]}", sans-serif`;
                let w = ctx.measureText(text[i]).width;
                charWidths.push(w);
                totalWidth += w;
            }
            totalWidth += (text.length - 1) * letterSpacing;

            let startX = (canvas.width - totalWidth) / 2 + posX;

            ctx.fillStyle = textColor; 
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 3;

            for(let i = 0; i < text.length; i++) {
                ctx.save();
                
                let x = startX + charWidths[i] / 2;
                let y = (canvas.height / 2) + posY + Math.sin(i * waveFreq) * waveAmp;
                
                ctx.translate(x, y);
                ctx.transform(scaleX, skewY, skewX, scaleY, 0, 0); 
                
                let currentRot = (Math.random() * randomRot * 2 - randomRot) * (Math.PI / 180);
                ctx.rotate(currentRot);
                
                ctx.font = `bold ${fontSize}px "${letterFonts[i]}", sans-serif`;

                if(useStroke) { ctx.strokeText(text[i], 0, 0); } 
                else { ctx.fillText(text[i], 0, 0); }

                ctx.restore();
                startX += charWidths[i] + letterSpacing;
            }

            ctx.restore();
            ctx.filter = 'none'; 
        }

        // Générateur de couleurs foncées (pour rester lisible sur fond blanc/clair)
        function getRandomDarkColor() {
            const r = Math.floor(Math.random() * 150).toString(16).padStart(2, '0');
            const g = Math.floor(Math.random() * 150).toString(16).padStart(2, '0');
            const b = Math.floor(Math.random() * 150).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        document.getElementById('randomBtn').addEventListener('click', () => {
            const useMixed = Math.random() > 0.4; // 60% de chance d'avoir un mélange
            if (useMixed) {
                document.getElementById('fontStyle').value = "MIXED";
            } else {
                const randomFont = googleFonts[Math.floor(Math.random() * googleFonts.length)];
                document.getElementById('fontStyle').value = randomFont;
            }

            // Valeurs maîtrisées pour garantir l'esthétique et la lisibilité
            document.getElementById('posX').value = Math.floor(Math.random() * 20 - 10);
            document.getElementById('posY').value = Math.floor(Math.random() * 20 - 10);
            document.getElementById('letterSpacing').value = Math.floor(Math.random() * 15 + 2);
            
            document.getElementById('scale').value = (Math.random() * 0.4 + 0.9).toFixed(1); // Entre 0.9 et 1.3
            document.getElementById('scaleX').value = (Math.random() * 0.4 + 0.8).toFixed(1); // Entre 0.8 et 1.2
            document.getElementById('scaleY').value = (Math.random() * 0.4 + 0.8).toFixed(1); // Entre 0.8 et 1.2
            document.getElementById('skewX').value = (Math.random() * 0.6 - 0.3).toFixed(2); // Entre -0.3 et 0.3
            document.getElementById('skewY').value = (Math.random() * 0.2 - 0.1).toFixed(2); // Entre -0.1 et 0.1
            
            document.getElementById('randomRot').value = Math.floor(Math.random() * 15); // Max 15 degrés
            document.getElementById('waveAmp').value = Math.floor(Math.random() * 15); // Max 15px de vague
            document.getElementById('waveFreq').value = (Math.random() * 1.5).toFixed(1); 
            
            // Le flou rend souvent illisible, on le met rarement et léger (1 fois sur 10 max)
            document.getElementById('blur').value = Math.random() > 0.9 ? (Math.random() * 1.5).toFixed(1) : 0;

            document.getElementById('textColor').value = getRandomDarkColor();

            useStroke = Math.random() > 0.7; // 30% de chance d'avoir le style contour
            document.getElementById('toggleStyleBtn').textContent = useStroke ? "Style : Contour" : "Style : Rempli";

            renderCaptcha();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const format = document.getElementById('exportFormat').value;
            
            let fileName = prompt("Entrez le nom de votre fichier :", "mon_captcha");
            if (!fileName) return; 

            const link = document.createElement('a');
            link.download = `${fileName}.${format}`;

            if (format === 'jpeg') {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.fillStyle = '#FFFFFF';
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                tempCtx.drawImage(canvas, 0, 0);
                
                link.href = tempCanvas.toDataURL('image/jpeg', 1.0);
            } else {
                link.href = canvas.toDataURL('image/png', 1.0);
            }

            link.click();
        });

        const toggleBtn = document.getElementById('toggleStyleBtn');
        toggleBtn.addEventListener('click', () => {
            useStroke = !useStroke;
            toggleBtn.textContent = useStroke ? "Style : Contour" : "Style : Rempli";
            renderCaptcha();
        });

        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => { input.addEventListener('input', renderCaptcha); });
        fontSelect.addEventListener('change', (e) => {
            if (e.target.value !== "MIXED") {
                loadGoogleFont(e.target.value, renderCaptcha);
            } else {
                renderCaptcha();
            }
        });

        loadAllFonts(() => {
            renderCaptcha();
        });
    </script>
</body>
</html>
