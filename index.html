<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha's Club Generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23000000'/><text x='50' y='67' text-anchor='middle' fill='%23FFFFFF' font-size='65' font-family='monospace' font-weight='bold'>c</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFFFF;
            --panel-bg: #F9F9F9;
            --text-color: #111111;
            --border-color: #DDDDDD;
            --accent: #000000;
            --red: #E63946;
        }

        /* --- CONFIGURATION GLOBALE --- */
        html { box-sizing: border-box; overflow-x: hidden; }
        *, *:before, *:after { box-sizing: inherit; }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR GAUCHE (Réglages) --- */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: #CCC; border-radius: 3px; }

        .section-title {
            background-color: var(--accent);
            color: var(--bg-color);
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }

        .row-group { display: flex; gap: 10px; }

        label {
            color: #555555;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="text"], select, input[type="color"] {
            padding: 8px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            width: 100%;
            outline: none;
            transition: border 0.2s;
        }
        
        input[type="text"]:focus, select:focus { border-color: var(--accent); }
        input[type="color"] { height: 40px; cursor: pointer; padding: 2px; }
        
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            padding: 5px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
            border-radius: 50%;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #DDDDDD;
            border-radius: 2px;
        }

        .btn-toggle {
            background-color: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-toggle:hover { background-color: var(--accent); color: var(--bg-color); border-color: var(--accent); }
        
        .btn-danger { color: var(--red); border-color: #ffb3c1; }
        .btn-danger:hover { background-color: var(--red); color: var(--bg-color); border-color: var(--red); }

        /* --- CONTENU PRINCIPAL DROITE --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
        }

        .site-title {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            color: var(--text-color);
        }

        .canvas-container {
            margin-bottom: 30px;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
        }

        canvas {
            background-color: var(--bg-color);
            border: 2px solid var(--border-color);
            width: 100%;
            height: auto;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.05);
            border-radius: 4px;
            touch-action: none;
            cursor: default;
        }

        .action-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 25px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-group {
            display: flex;
            gap: 10px;
            align-items: center;
            border-right: 1px solid var(--border-color);
            padding-right: 15px;
        }

        .action-group:last-child { border: none; padding-right: 0; }

        .btn-primary, .btn-vasy {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            border-radius: 4px;
            transition: transform 0.1s, background 0.2s;
        }
        
        .btn-primary { background-color: var(--accent); color: var(--bg-color); border: none; }
        .btn-primary:active { transform: scale(0.95); }

        .btn-vasy { background-color: transparent; color: var(--text-color); border: 2px solid var(--accent); }
        .btn-vasy:hover, .btn-vasy:active { background-color: var(--accent); color: var(--bg-color); }

        @media (max-width: 768px) {
            body { flex-direction: column; height: auto; overflow: visible; }
            .main-content {
                order: 1; position: sticky; top: 0; z-index: 100;
                background-color: var(--bg-color); padding: 15px 10px;
                border-bottom: 1px solid var(--border-color); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            }
            .sidebar { order: 2; width: 100%; border-right: none; overflow-y: visible; padding: 20px; }
            .site-title { position: relative; top: 0; right: 0; font-size: 1.8rem; text-align: center; margin-bottom: 15px; }
            .canvas-container { margin-bottom: 15px; }
            .action-bar { padding: 10px; width: 100%; }
            .action-group { border-right: none; padding-right: 0; width: 100%; justify-content: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
            .action-group:last-child { border-bottom: none; padding-bottom: 0; padding-top: 10px; }
            label { font-size: 0.85rem; padding: 5px 0; }
            input[type="range"]::-webkit-slider-thumb { height: 20px; width: 20px; margin-top: -8px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <!-- Favoris (Presets) -->
        <div>
            <div class="section-title">Favoris (Préréglages)</div>
            <div class="control-group">
                <select id="presetSelect">
                    <option value="">-- Choisir un favori --</option>
                </select>
            </div>
            <div class="row-group">
                <button class="btn-toggle" id="savePresetBtn">Sauvegarder</button>
                <button class="btn-toggle btn-danger" id="deletePresetBtn">Supprimer</button>
            </div>
        </div>

        <!-- Base -->
        <div>
            <div class="section-title">Base</div>
            <div class="control-group">
                <label>Texte</label>
                <input type="text" id="textInput" value="valite" maxlength="300">
            </div>
            <div class="control-group">
                <label>Police Google</label>
                <select id="fontStyle"></select>
            </div>
            <div class="control-group">
                <label>Couleur du texte</label>
                <input type="color" id="textColor" value="#E60000">
            </div>
            <div class="control-group">
                <button class="btn-toggle" id="toggleStyleBtn">Style : Rempli</button>
            </div>
        </div>

        <!-- Positionnement -->
        <div>
            <div class="section-title">Positionnement</div>
            <div class="control-group"><label>Position X</label><input type="range" id="posX" min="-200" max="200" value="0"></div>
            <div class="control-group"><label>Position Y</label><input type="range" id="posY" min="-100" max="100" value="0"></div>
            <div class="control-group"><label>Espacement Lettres</label><input type="range" id="letterSpacing" min="-40" max="40" value="-8"></div>
        </div>

        <!-- Distorsion -->
        <div>
            <div class="section-title">Distorsion & Étirement</div>
            <div class="control-group"><label>Échelle Globale</label><input type="range" id="scale" min="0.1" max="4.0" step="0.1" value="1.5"></div>
            <div class="control-group"><label>Étirer Largeur (X)</label><input type="range" id="scaleX" min="0.1" max="3.0" step="0.1" value="0.8"></div>
            <div class="control-group"><label>Étirer Hauteur (Y)</label><input type="range" id="scaleY" min="0.1" max="4.0" step="0.1" value="1.3"></div>
            <div class="control-group"><label>Inclinaison H (Skew X)</label><input type="range" id="skewX" min="-3.0" max="3.0" step="0.1" value="-0.8"></div>
            <div class="control-group"><label>Inclinaison V (Skew Y)</label><input type="range" id="skewY" min="-1.5" max="1.5" step="0.1" value="0.0"></div>
        </div>

        <!-- Chaos & Effets -->
        <div>
            <div class="section-title">Chaos & Effets</div>
            <div class="control-group"><label>Rotation Aléatoire</label><input type="range" id="randomRot" min="0" max="90" value="0"></div>
            <div class="control-group"><label>Amplitude Vague</label><input type="range" id="waveAmp" min="0" max="100" value="35"></div>
            <div class="control-group"><label>Fréquence Vague</label><input type="range" id="waveFreq" min="0" max="10" step="0.1" value="1.2"></div>
            <div class="control-group"><label>Flou (Blur)</label><input type="range" id="blur" min="0" max="10" step="0.5" value="0"></div>
        </div>
    </aside>

    <main class="main-content">
        <h1 class="site-title">captcha's club</h1>
        
        <div class="canvas-container">
            <canvas id="captchaCanvas" width="400" height="150" title="Vous pouvez glisser-déposer chaque lettre !"></canvas>
        </div>

        <div class="action-bar">
            <div class="action-group">
                <select id="exportFormat" style="width: auto;">
                    <option value="png">PNG (Transparent)</option>
                    <option value="jpeg">JPEG (Fond Blanc)</option>
                </select>
                <button class="btn-primary" id="exportBtn">Exporter</button>
            </div>
            <div class="action-group">
                <button class="btn-vasy" id="randomBtn">Vas-y</button>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        let useStroke = false;

        // Variables pour le Drag & Drop
        let manualOffsets = []; 
        let clickableZones = []; 
        let draggingIndex = null;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // Polices "Script" et fluides pour un rendu attaché/manuscrit
        const googleFonts = [
            "Dancing Script", "Pacifico", "Great Vibes", "Sacramento", 
            "Yellowtail", "Parisienne", "Allura", "Alex Brush", 
            "Mr De Haviland", "Leckerli One", "Cookie", "Damion"
        ];

        // Couleurs strictes : Bleu, Vert, Rouge
        const vintageColors = ["#0022EE", "#EE1111", "#00AA22"];

        const fontSelect = document.getElementById('fontStyle');
        googleFonts.forEach(font => {
            let option = document.createElement('option');
            option.value = font;
            option.textContent = font;
            fontSelect.appendChild(option);
        });

        // --- GÉNÉRATEUR DE MOTS (Minuscules) ---
        function generateNonsenseWord() {
            const consonants = "bcdfghjklmnpqrstvwxyz";
            const vowels = "aeiouy";
            let word = "";
            let length = Math.floor(Math.random() * 4) + 6; 
            let isConsonant = Math.random() > 0.5;
            
            for (let i = 0; i < length; i++) {
                if (isConsonant) {
                    word += consonants[Math.floor(Math.random() * consonants.length)];
                } else {
                    word += vowels[Math.floor(Math.random() * vowels.length)];
                }
                isConsonant = !isConsonant; 
            }
            // Tout en minuscules pour l'effet fluide
            return word.toLowerCase();
        }

        // --- GESTION DES FAVORIS (PRESETS) ---
        const presetSelect = document.getElementById('presetSelect');

        function loadPresetsList() {
            const presets = JSON.parse(localStorage.getItem('captchaPresets') || '{}');
            presetSelect.innerHTML = '<option value="">-- Choisir un favori --</option>';
            for (let name in presets) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                presetSelect.appendChild(opt);
            }
        }

        document.getElementById('savePresetBtn').addEventListener('click', () => {
            let name = prompt("Donnez un nom à ce réglage :");
            if (!name) return;
            
            const preset = {
                text: document.getElementById('textInput').value,
                font: document.getElementById('fontStyle').value,
                color: document.getElementById('textColor').value,
                useStroke: useStroke,
                posX: document.getElementById('posX').value,
                posY: document.getElementById('posY').value,
                letterSpacing: document.getElementById('letterSpacing').value,
                scale: document.getElementById('scale').value,
                scaleX: document.getElementById('scaleX').value,
                scaleY: document.getElementById('scaleY').value,
                skewX: document.getElementById('skewX').value,
                skewY: document.getElementById('skewY').value,
                randomRot: document.getElementById('randomRot').value,
                waveAmp: document.getElementById('waveAmp').value,
                waveFreq: document.getElementById('waveFreq').value,
                blur: document.getElementById('blur').value,
                offsets: JSON.parse(JSON.stringify(manualOffsets))
            };

            const presets = JSON.parse(localStorage.getItem('captchaPresets') || '{}');
            presets[name] = preset;
            localStorage.setItem('captchaPresets', JSON.stringify(presets));
            loadPresetsList();
            presetSelect.value = name;
        });

        document.getElementById('deletePresetBtn').addEventListener('click', () => {
            let name = presetSelect.value;
            if (!name) return;
            if(confirm(`Êtes-vous sûr de vouloir supprimer le favori "${name}" ?`)) {
                const presets = JSON.parse(localStorage.getItem('captchaPresets') || '{}');
                delete presets[name];
                localStorage.setItem('captchaPresets', JSON.stringify(presets));
                loadPresetsList();
                presetSelect.value = "";
            }
        });

        presetSelect.addEventListener('change', (e) => {
            let name = e.target.value;
            if (!name) return;
            
            const presets = JSON.parse(localStorage.getItem('captchaPresets') || '{}');
            const p = presets[name];
            if (p) {
                document.getElementById('textInput').value = p.text;
                document.getElementById('fontStyle').value = p.font;
                document.getElementById('textColor').value = p.color;
                
                useStroke = p.useStroke;
                document.getElementById('toggleStyleBtn').textContent = useStroke ? "Style : Contour" : "Style : Rempli";
                
                document.getElementById('posX').value = p.posX;
                document.getElementById('posY').value = p.posY;
                document.getElementById('letterSpacing').value = p.letterSpacing;
                document.getElementById('scale').value = p.scale;
                document.getElementById('scaleX').value = p.scaleX;
                document.getElementById('scaleY').value = p.scaleY;
                document.getElementById('skewX').value = p.skewX;
                document.getElementById('skewY').value = p.skewY;
                document.getElementById('randomRot').value = p.randomRot;
                document.getElementById('waveAmp').value = p.waveAmp;
                document.getElementById('waveFreq').value = p.waveFreq;
                document.getElementById('blur').value = p.blur;

                manualOffsets = p.offsets || [];
                loadGoogleFont(p.font, renderCaptcha);
            }
        });

        function loadGoogleFont(fontName, callback) {
            const fontId = 'font-' + fontName.replace(/\s+/g, '-').toLowerCase();
            if (!document.getElementById(fontId)) {
                const link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}&display=swap`;
                document.head.appendChild(link);
                document.fonts.load(`16px "${fontName}"`).then(() => callback());
            } else {
                callback();
            }
        }

        function loadAllFonts(callback) {
            let loaded = 0;
            googleFonts.forEach(font => {
                loadGoogleFont(font, () => {
                    loaded++;
                    if(loaded === googleFonts.length && callback) callback();
                });
            });
        }

        function renderCaptcha() {
            const text = document.getElementById('textInput').value || " ";
            const selectedFont = document.getElementById('fontStyle').value;
            const textColor = document.getElementById('textColor').value;
            
            const posX = parseFloat(document.getElementById('posX').value);
            const posY = parseFloat(document.getElementById('posY').value);
            const letterSpacing = parseFloat(document.getElementById('letterSpacing').value);
            
            const scale = parseFloat(document.getElementById('scale').value);
            const scaleX = parseFloat(document.getElementById('scaleX').value);
            const scaleY = parseFloat(document.getElementById('scaleY').value);
            const skewX = parseFloat(document.getElementById('skewX').value);
            const skewY = parseFloat(document.getElementById('skewY').value);
            
            const randomRot = parseFloat(document.getElementById('randomRot').value);
            const waveAmp = parseFloat(document.getElementById('waveAmp').value);
            const waveFreq = parseFloat(document.getElementById('waveFreq').value);
            const blur = parseFloat(document.getElementById('blur').value);

            while (manualOffsets.length < text.length) manualOffsets.push({x: 0, y: 0});
            manualOffsets = manualOffsets.slice(0, text.length);
            
            clickableZones = []; 

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.filter = `blur(${blur}px)`;
            const fontSize = 50 * scale; 

            ctx.save();
            let totalWidth = 0;
            let charWidths = [];
            
            ctx.font = `bold ${fontSize}px "${selectedFont}", cursive`;
            
            for(let i = 0; i < text.length; i++) {
                let w = ctx.measureText(text[i]).width;
                charWidths.push(w);
                totalWidth += w;
            }
            totalWidth += (text.length - 1) * letterSpacing;

            let startX = (canvas.width - totalWidth) / 2 + posX;

            ctx.fillStyle = textColor; 
            ctx.strokeStyle = textColor;
            ctx.lineWidth = 2;

            for(let i = 0; i < text.length; i++) {
                ctx.save();
                
                let offsetX = manualOffsets[i].x;
                let offsetY = manualOffsets[i].y;
                
                let x = startX + charWidths[i] / 2 + offsetX;
                let y = (canvas.height / 2) + posY + Math.sin(i * waveFreq) * waveAmp + offsetY;
                
                clickableZones.push({
                    index: i,
                    x: x,
                    y: y,
                    radius: fontSize * 0.5 
                });

                ctx.translate(x, y);

                // Application de la déformation GLOBALE (pas de chaos par lettre)
                // Cela permet aux polices cursives de rester fluides et attachées.
                ctx.transform(scaleX, skewY, skewX, scaleY, 0, 0); 
                
                // Très légère rotation aléatoire si besoin, mais proche de 0 par défaut
                let currentRot = (Math.random() * randomRot * 2 - randomRot) * (Math.PI / 180);
                ctx.rotate(currentRot);
                
                ctx.font = `bold ${fontSize}px "${selectedFont}", cursive`;

                if(useStroke) { ctx.strokeText(text[i], 0, 0); } 
                else { ctx.fillText(text[i], 0, 0); }

                ctx.restore();
                startX += charWidths[i] + letterSpacing;
            }

            ctx.restore();
            ctx.filter = 'none'; 
        }

        // --- GESTION DU DRAG & DROP ---
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function handlePointerDown(e) {
            const pos = getPointerPos(e);
            let closestIndex = null;
            let minDist = Infinity;
            
            for (let zone of clickableZones) {
                let dist = Math.hypot(pos.x - zone.x, pos.y - zone.y);
                if (dist < zone.radius && dist < minDist) {
                    minDist = dist;
                    closestIndex = zone.index;
                }
            }
            
            if (closestIndex !== null) {
                if(e.cancelable) e.preventDefault(); 
                draggingIndex = closestIndex;
                lastMouseX = pos.x;
                lastMouseY = pos.y;
                canvas.style.cursor = 'grabbing';
            }
        }

        function handlePointerMove(e) {
            const pos = getPointerPos(e);
            
            if (draggingIndex === null) {
                let hover = false;
                for (let zone of clickableZones) {
                    if (Math.hypot(pos.x - zone.x, pos.y - zone.y) < zone.radius) {
                        hover = true;
                        break;
                    }
                }
                canvas.style.cursor = hover ? 'grab' : 'default';
                return;
            }
            
            if(e.cancelable) e.preventDefault(); 
            
            const dx = pos.x - lastMouseX;
            const dy = pos.y - lastMouseY;
            
            manualOffsets[draggingIndex].x += dx;
            manualOffsets[draggingIndex].y += dy;
            
            lastMouseX = pos.x;
            lastMouseY = pos.y;
            
            renderCaptcha();
        }

        function handlePointerUp() {
            draggingIndex = null;
            canvas.style.cursor = 'default';
        }

        canvas.addEventListener('mousedown', handlePointerDown);
        canvas.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('mouseup', handlePointerUp);

        canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
        canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);


        document.getElementById('randomBtn').addEventListener('click', () => {
            // Un mot généré en minuscules, police Script, couleurs franches
            document.getElementById('textInput').value = generateNonsenseWord();
            document.getElementById('fontStyle').value = googleFonts[Math.floor(Math.random() * googleFonts.length)];
            document.getElementById('textColor').value = vintageColors[Math.floor(Math.random() * vintageColors.length)];

            document.getElementById('posX').value = 0;
            document.getElementById('posY').value = 0;
            
            // Espacement très rapproché pour lier la typographie cursive
            document.getElementById('letterSpacing').value = -Math.floor(Math.random() * 8 + 4); 
            
            document.getElementById('scale').value = (Math.random() * 0.4 + 1.2).toFixed(1); 
            document.getElementById('scaleX').value = (Math.random() * 0.2 + 0.7).toFixed(1); // Très condensé
            document.getElementById('scaleY').value = (Math.random() * 0.4 + 1.2).toFixed(1); // Très étiré verticalement
            
            // Forte inclinaison italique
            document.getElementById('skewX').value = (Math.random() * -0.6 - 0.4).toFixed(2); 
            document.getElementById('skewY').value = (Math.random() * 0.2 - 0.1).toFixed(2); 
            
            // Rotation à 0 pour garder la ligne de la police script fluide
            document.getElementById('randomRot').value = 0; 
            // Amplitude forte pour la vague
            document.getElementById('waveAmp').value = Math.floor(Math.random() * 25 + 15); 
            document.getElementById('waveFreq').value = (Math.random() * 0.8 + 0.8).toFixed(1); 
            
            document.getElementById('blur').value = 0;

            useStroke = false; 
            document.getElementById('toggleStyleBtn').textContent = "Style : Rempli";

            document.getElementById('presetSelect').value = "";
            manualOffsets = []; 
            renderCaptcha();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const format = document.getElementById('exportFormat').value;
            let fileName = prompt("Entrez le nom de votre fichier :", "mon_captcha");
            if (!fileName) return; 

            const link = document.createElement('a');
            link.download = `${fileName}.${format}`;

            if (format === 'jpeg') {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                
                tempCtx.fillStyle = '#FFFFFF'; 
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
                tempCtx.drawImage(canvas, 0, 0);
                
                link.href = tempCanvas.toDataURL('image/jpeg', 1.0);
            } else {
                link.href = canvas.toDataURL('image/png', 1.0);
            }

            link.click();
        });

        const toggleBtn = document.getElementById('toggleStyleBtn');
        toggleBtn.addEventListener('click', () => {
            useStroke = !useStroke;
            toggleBtn.textContent = useStroke ? "Style : Contour" : "Style : Rempli";
            renderCaptcha();
        });

        const inputs = document.querySelectorAll('input:not([type="button"])');
        inputs.forEach(input => { 
            input.addEventListener('input', () => {
                document.getElementById('presetSelect').value = "";
                renderCaptcha();
            }); 
        });
        
        fontSelect.addEventListener('change', (e) => {
            document.getElementById('presetSelect').value = "";
            loadGoogleFont(e.target.value, renderCaptcha);
        });

        // INIT
        loadPresetsList();
        loadAllFonts(() => {
            document.getElementById('randomBtn').click();
        });
    </script>
</body>
</html>
