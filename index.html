<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha's Club Generator</title>
    <!-- Importation des polices de base pour l'interface -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #1100FF; /* Bleu électrique de l'affiche */
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif; /* Typo moderne pour les réglages */
            margin: 0;
            padding: 40px 20px;
            background-color: var(--blue);
            color: var(--white);
        }

        /* Top Right Logo - Typo Pixel art */
        .site-title {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Grid Layout for Controls */
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 40px auto 60px auto;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Column Headers (White Pills) */
        .col-header {
            background-color: var(--white);
            color: var(--blue);
            padding: 8px 15px;
            border-radius: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Labels and Inputs */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            color: var(--white);
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.9;
        }

        input[type="text"], select {
            padding: 8px;
            background: transparent;
            border: 1px solid var(--white);
            border-radius: 4px;
            color: var(--white);
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            width: 100%;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: rgba(255,255,255,0.5);
        }

        /* Custom Select Styling */
        select option {
            background-color: var(--blue);
            color: var(--white);
        }

        /* Custom Range Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 0; /* Aspect plus brutaliste, carré */
            background: var(--white);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
        }

        /* Buttons */
        .btn-black {
            background-color: transparent;
            color: var(--white);
            border: 1px solid var(--white);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-black:hover {
            background-color: var(--white);
            color: var(--blue);
        }

        /* Canvas Area */
        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
        }

        canvas {
            background-color: var(--blue); /* Fond bleu pour se fondre ou contraster */
            border: 2px solid var(--white);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <div class="site-title">captcha's club</div>

    <div class="controls-grid">
        <!-- Text Column -->
        <div class="column">
            <div class="col-header">Text</div>
            <div class="control-group">
                <label>Text (max 8)</label>
                <input type="text" id="textInput" value="gAvTyG5" maxlength="8">
            </div>
            <div class="control-group">
                <label>Google Fonts</label>
                <select id="fontStyle">
                    <!-- Rempli par JavaScript -->
                </select>
            </div>
            <div class="control-group"><label>Placement</label><input type="range" id="placement" min="-50" max="50" value="0"></div>
            <div class="control-group"><label>Skew</label><input type="range" id="skew" min="-1" max="1" step="0.1" value="0.2"></div>
            <div class="control-group"><label>Scale</label><input type="range" id="scale" min="0.5" max="2" step="0.1" value="1.2"></div>
            <div class="control-group"><label>Warp</label><input type="range" id="warp" min="0" max="20" value="5"></div>
        </div>

        <!-- Fill/Stroke Column -->
        <div class="column">
            <div class="col-header">Style</div>
            <button class="btn-black" id="toggleStyleBtn">Fill / Stroke</button>
        </div>

        <!-- 3D Type Column (Simulée via ombre) -->
        <div class="column">
            <div class="col-header">3D Type</div>
            <div class="control-group"><label>Extrude Depth</label><input type="range" id="extrude" min="0" max="20" value="0"></div>
        </div>

        <!-- Noise Column -->
        <div class="column">
            <div class="col-header">Noise</div>
            <div class="control-group"><label>Intensity</label><input type="range" id="noiseIntensity" min="0" max="100" value="15"></div>
        </div>

        <!-- Dots Column -->
        <div class="column">
            <div class="col-header">Dots</div>
            <div class="control-group"><label>Size</label><input type="range" id="dotSize" min="1" max="5" value="2"></div>
            <div class="control-group"><label>Density</label><input type="range" id="dotDensity" min="0" max="200" value="50"></div>
        </div>

        <!-- Lines Column -->
        <div class="column">
            <div class="col-header">Lines</div>
            <div class="control-group"><label>Density</label><input type="range" id="lineDensity" min="0" max="30" value="5"></div>
            <div class="control-group"><label>Thickness</label><input type="range" id="lineThickness" min="1" max="10" value="2"></div>
        </div>
    </div>

    <!-- Live Preview -->
    <div class="canvas-container">
        <canvas id="captchaCanvas" width="600" height="200"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        let useStroke = false; // Toggle Fill or Stroke text

        // Liste massive de Google Fonts (catégories variées)
        const googleFonts = [
            "VT323", "Inter", "Roboto", "Open Sans", "Montserrat", "Lato", "Oswald", "Source Sans Pro", 
            "Slabo 27px", "Raleway", "PT Sans", "Ubuntu", "Merriweather", "Lora", "Playfair Display", 
            "Rubik", "Noto Sans", "Nunito", "Titillium Web", "Work Sans", "Fira Sans", "Quicksand", 
            "Inconsolata", "Bebas Neue", "Dancing Script", "Pacifico", "Anton", "Josefin Sans", 
            "Righteous", "Lobster", "Comfortaa", "Exo 2", "Teko", "Cinzel", "Courgette", 
            "Alfa Slab One", "Permanent Marker", "Amatic SC", "Bangers", "Press Start 2P", 
            "Creepster", "Special Elite", "Freckle Face", "Wallpoet", "Monoton", "Orbitron", 
            "Syncopate", "Faster One", "Cabin Sketch", "Nosifer"
        ];

        const fontSelect = document.getElementById('fontStyle');

        // Peupler le menu déroulant avec la liste
        googleFonts.forEach(font => {
            let option = document.createElement('option');
            option.value = font;
            option.textContent = font;
            fontSelect.appendChild(option);
        });

        // Fonction pour charger dynamiquement une Google Font
        function loadGoogleFont(fontName, callback) {
            const fontId = 'font-' + fontName.replace(/\s+/g, '-').toLowerCase();
            if (!document.getElementById(fontId)) {
                const link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}&display=swap`;
                document.head.appendChild(link);
                
                // Attendre que la police soit chargée dans le document
                document.fonts.load(`16px "${fontName}"`).then(() => {
                    callback();
                });
            } else {
                callback();
            }
        }

        function renderCaptcha() {
            // Récupération des valeurs
            const text = document.getElementById('textInput').value;
            const font = document.getElementById('fontStyle').value;
            const skew = parseFloat(document.getElementById('skew').value);
            const scale = parseFloat(document.getElementById('scale').value);
            const placement = parseFloat(document.getElementById('placement').value);
            const warp = parseFloat(document.getElementById('warp').value);
            const extrude = parseInt(document.getElementById('extrude').value);
            
            const dotDensity = parseInt(document.getElementById('dotDensity').value);
            const dotSize = parseInt(document.getElementById('dotSize').value);
            const lineDensity = parseInt(document.getElementById('lineDensity').value);
            const lineThickness = parseInt(document.getElementById('lineThickness').value);
            const noiseIntensity = parseInt(document.getElementById('noiseIntensity').value);

            // Nettoyer le canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Fond Brutaliste Bleu
            ctx.fillStyle = '#1100FF'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dessin des lignes (Blanches)
            for(let i = 0; i < lineDensity; i++) {
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.strokeStyle = `rgba(255, 255, 255, 0.6)`;
                ctx.lineWidth = lineThickness;
                ctx.stroke();
            }

            // Dessin des points (Blancs, façon carrés de pixels pour le style)
            for(let i = 0; i < dotDensity; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, 0.7)`;
                ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, dotSize, dotSize);
            }

            // Préparation du texte
            ctx.save();
            ctx.font = `bold ${50 * scale}px "${font}", sans-serif`;
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;

            // Transformations : Placement et Skew (Inclinaison)
            ctx.translate(canvas.width / 2 + placement, canvas.height / 2);
            ctx.transform(1, 0, skew, 1, 0, 0); 
            
            // Effet 3D (Extrude)
            if (extrude > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                for(let i = extrude; i > 0; i--) {
                    ctx.fillText(text, i, i);
                }
                ctx.fillStyle = '#FFFFFF'; // Reset pour le texte principal
            }

            // Déformation (Warp) et Dessin du texte
            if (warp > 0) {
                let startX = -(ctx.measureText(text).width / 2);
                for(let i = 0; i < text.length; i++) {
                    let yOffset = (Math.random() - 0.5) * warp;
                    if(useStroke) {
                        ctx.strokeText(text[i], startX, yOffset);
                    } else {
                        ctx.fillText(text[i], startX, yOffset);
                    }
                    startX += ctx.measureText(text[i]).width;
                }
            } else {
                if(useStroke) {
                    ctx.strokeText(text, 0, 0);
                } else {
                    ctx.fillText(text, 0, 0);
                }
            }
            ctx.restore();

            // Effet Bruit (Pixels aléatoires)
            if (noiseIntensity > 0) {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < (noiseIntensity / 1000)) {
                        data[i] = 255;   // R = blanc
                        data[i+1] = 255; // G = blanc
                        data[i+2] = 255; // B = blanc
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }
        }

        // Toggle Bouton Fill/Stroke
        document.getElementById('toggleStyleBtn').addEventListener('click', () => {
            useStroke = !useStroke;
            renderCaptcha();
        });

        // Event listeners pour les inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('input', renderCaptcha);
        });

        // Event listener spécifique pour le changement de police
        fontSelect.addEventListener('change', (e) => {
            const selectedFont = e.target.value;
            // On charge la police depuis Google, puis on redessine le Canvas
            loadGoogleFont(selectedFont, renderCaptcha);
        });

        // Initialisation : On charge la première police ("VT323") puis on génère
        loadGoogleFont(fontSelect.value, renderCaptcha);
    </script>
</body>
</html>
