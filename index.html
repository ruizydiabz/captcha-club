<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha's Club Generator</title>
    <!-- Importation des polices -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #1100FF;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--blue);
            color: var(--white);
            display: flex;
            height: 100vh;
            overflow: hidden; /* Empêche le scroll global */
        }

        /* --- SIDEBAR GAUCHE (Réglages) --- */
        .sidebar {
            width: 320px;
            background-color: var(--blue);
            border-right: 2px solid var(--white);
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Scrollbar custom pour la sidebar */
        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--white); }

        .section-title {
            background-color: var(--white);
            color: var(--blue);
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }

        label {
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.9;
        }

        input[type="text"], select {
            padding: 6px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 3px;
            color: var(--white);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        
        input[type="text"]:focus, select:focus {
            border-color: var(--white);
        }

        select option {
            background-color: var(--blue);
            color: var(--white);
        }

        /* Curseurs (Sliders) plus petits */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            background: var(--white);
            cursor: pointer;
            margin-top: -4px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 3px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
        }

        .btn-toggle {
            background-color: transparent;
            color: var(--white);
            border: 1px solid var(--white);
            padding: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-toggle:hover {
            background-color: var(--white);
            color: var(--blue);
        }

        /* --- CONTENU PRINCIPAL DROITE --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
        }

        .site-title {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .canvas-container {
            margin-bottom: 30px;
        }

        canvas {
            background-color: var(--blue);
            border: 2px solid var(--white);
            max-width: 100%;
            box-shadow: 10px 10px 0px rgba(255,255,255,0.1);
        }

        /* --- BARRE D'ACTIONS --- */
        .action-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .action-group {
            display: flex;
            gap: 5px;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 15px;
        }

        .action-group:last-child { border: none; padding-right: 0; }

        .btn-primary {
            background-color: var(--white);
            color: var(--blue);
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.95); }

        .btn-vasy {
            background-color: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-vasy:hover {
            background-color: var(--white);
            color: var(--blue);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <!-- Text -->
        <div>
            <div class="section-title">Texte</div>
            <div class="control-group">
                <label>Texte (max 8)</label>
                <input type="text" id="textInput" value="gAvTyG5" maxlength="8">
            </div>
            <div class="control-group">
                <label>Police Google</label>
                <select id="fontStyle"></select>
            </div>
            <div class="control-group"><label>Position</label><input type="range" id="placement" min="-50" max="50" value="0"></div>
            <div class="control-group"><label>Inclinaison</label><input type="range" id="skew" min="-1" max="1" step="0.1" value="0.2"></div>
            <div class="control-group"><label>Échelle</label><input type="range" id="scale" min="0.5" max="2" step="0.1" value="1.2"></div>
            <div class="control-group"><label>Déformation (Warp)</label><input type="range" id="warp" min="0" max="30" value="5"></div>
        </div>

        <!-- Style -->
        <div>
            <div class="section-title">Style</div>
            <button class="btn-toggle" id="toggleStyleBtn">Remplissage / Contour</button>
        </div>

        <!-- 3D -->
        <div>
            <div class="section-title">Effet 3D</div>
            <div class="control-group"><label>Profondeur</label><input type="range" id="extrude" min="0" max="20" value="0"></div>
        </div>

        <!-- Lignes -->
        <div>
            <div class="section-title">Lignes</div>
            <div class="control-group"><label>Densité</label><input type="range" id="lineDensity" min="0" max="30" value="5"></div>
            <div class="control-group"><label>Épaisseur</label><input type="range" id="lineThickness" min="1" max="10" value="2"></div>
        </div>

        <!-- Points -->
        <div>
            <div class="section-title">Points</div>
            <div class="control-group"><label>Taille</label><input type="range" id="dotSize" min="1" max="5" value="2"></div>
            <div class="control-group"><label>Densité</label><input type="range" id="dotDensity" min="0" max="200" value="50"></div>
        </div>

        <!-- Bruit -->
        <div>
            <div class="section-title">Bruit (Pixels)</div>
            <div class="control-group"><label>Intensité</label><input type="range" id="noiseIntensity" min="0" max="100" value="15"></div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <h1 class="site-title">captcha's club</h1>
        
        <div class="canvas-container">
            <canvas id="captchaCanvas" width="600" height="200"></canvas>
        </div>

        <!-- ACTIONS -->
        <div class="action-bar">
            <div class="action-group">
                <select id="exportFormat" style="width: auto; padding: 10px;">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="svg">SVG</option>
                </select>
                <button class="btn-primary" id="exportBtn">Exporter</button>
            </div>
            <div class="action-group">
                <button class="btn-vasy" id="randomBtn">Vas-y 🎲</button>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        let useStroke = false;
        
        // Variables pour mémoriser les paramètres actuels (utile pour l'export SVG)
        let currentDrawData = { lines: [], dots: [] };

        const googleFonts = [
            "VT323", "Inter", "Roboto", "Montserrat", "Oswald", "Playfair Display", 
            "Bebas Neue", "Dancing Script", "Pacifico", "Anton", "Righteous", 
            "Lobster", "Creepster", "Special Elite", "Monoton", "Orbitron", "Nosifer"
        ];

        const fontSelect = document.getElementById('fontStyle');

        googleFonts.forEach(font => {
            let option = document.createElement('option');
            option.value = font;
            option.textContent = font;
            fontSelect.appendChild(option);
        });

        function loadGoogleFont(fontName, callback) {
            const fontId = 'font-' + fontName.replace(/\s+/g, '-').toLowerCase();
            if (!document.getElementById(fontId)) {
                const link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}&display=swap`;
                document.head.appendChild(link);
                document.fonts.load(`16px "${fontName}"`).then(() => callback());
            } else {
                callback();
            }
        }

        function renderCaptcha() {
            const text = document.getElementById('textInput').value;
            const font = document.getElementById('fontStyle').value;
            const skew = parseFloat(document.getElementById('skew').value);
            const scale = parseFloat(document.getElementById('scale').value);
            const placement = parseFloat(document.getElementById('placement').value);
            const warp = parseFloat(document.getElementById('warp').value);
            const extrude = parseInt(document.getElementById('extrude').value);
            
            const dotDensity = parseInt(document.getElementById('dotDensity').value);
            const dotSize = parseInt(document.getElementById('dotSize').value);
            const lineDensity = parseInt(document.getElementById('lineDensity').value);
            const lineThickness = parseInt(document.getElementById('lineThickness').value);
            const noiseIntensity = parseInt(document.getElementById('noiseIntensity').value);

            // Réinitialiser les données mémorisées pour le SVG
            currentDrawData.lines = [];
            currentDrawData.dots = [];

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1100FF'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Lignes
            for(let i = 0; i < lineDensity; i++) {
                let x1 = Math.random() * canvas.width; let y1 = Math.random() * canvas.height;
                let x2 = Math.random() * canvas.width; let y2 = Math.random() * canvas.height;
                
                currentDrawData.lines.push({x1, y1, x2, y2, thickness: lineThickness}); // Sauvegarde
                
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = `rgba(255, 255, 255, 0.6)`;
                ctx.lineWidth = lineThickness;
                ctx.stroke();
            }

            // Points
            for(let i = 0; i < dotDensity; i++) {
                let x = Math.random() * canvas.width; let y = Math.random() * canvas.height;
                currentDrawData.dots.push({x, y, size: dotSize}); // Sauvegarde
                ctx.fillStyle = `rgba(255, 255, 255, 0.7)`;
                ctx.fillRect(x, y, dotSize, dotSize);
            }

            // Texte
            ctx.save();
            const fontSize = 50 * scale;
            ctx.font = `bold ${fontSize}px "${font}", sans-serif`;
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;

            ctx.translate(canvas.width / 2 + placement, canvas.height / 2);
            ctx.transform(1, 0, skew, 1, 0, 0); 
            
            if (extrude > 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                for(let i = extrude; i > 0; i--) { ctx.fillText(text, i, i); }
                ctx.fillStyle = '#FFFFFF';
            }

            currentDrawData.chars = []; // Sauvegarde pour SVG

            if (warp > 0) {
                let startX = -(ctx.measureText(text).width / 2);
                for(let i = 0; i < text.length; i++) {
                    let yOffset = (Math.random() - 0.5) * warp;
                    currentDrawData.chars.push({ char: text[i], x: startX, y: yOffset });
                    
                    if(useStroke) { ctx.strokeText(text[i], startX, yOffset); } 
                    else { ctx.fillText(text[i], startX, yOffset); }
                    
                    startX += ctx.measureText(text[i]).width;
                }
            } else {
                currentDrawData.chars.push({ char: text, x: 0, y: 0 });
                if(useStroke) { ctx.strokeText(text, 0, 0); } 
                else { ctx.fillText(text, 0, 0); }
            }
            ctx.restore();

            // Bruit pixel (Non inclus dans SVG car trop lourd)
            if (noiseIntensity > 0) {
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                for (let i = 0; i < data.length; i += 4) {
                    if (Math.random() < (noiseIntensity / 1000)) {
                        data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                    }
                }
                ctx.putImageData(imageData, 0, 0);
            }
        }

        // --- GESTION DES EXPORTS ---
        document.getElementById('exportBtn').addEventListener('click', () => {
            const format = document.getElementById('exportFormat').value;
            
            if (format === 'png' || format === 'jpeg') {
                const link = document.createElement('a');
                link.download = `captcha.${format}`;
                link.href = canvas.toDataURL(`image/${format}`, 1.0);
                link.click();
            } else if (format === 'svg') {
                // Construction manuelle d'un fichier SVG basé sur les calculs du canvas
                const w = canvas.width; const h = canvas.height;
                const font = document.getElementById('fontStyle').value;
                const skew = parseFloat(document.getElementById('skew').value);
                const scale = parseFloat(document.getElementById('scale').value);
                const placement = parseFloat(document.getElementById('placement').value);
                const fontSize = 50 * scale;

                let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
                    <rect width="100%" height="100%" fill="#1100FF"/>`;
                
                // SVG Lignes
                currentDrawData.lines.forEach(l => {
                    svgContent += `<line x1="${l.x1}" y1="${l.y1}" x2="${l.x2}" y2="${l.y2}" stroke="rgba(255,255,255,0.6)" stroke-width="${l.thickness}"/>`;
                });

                // SVG Points
                currentDrawData.dots.forEach(d => {
                    svgContent += `<rect x="${d.x}" y="${d.y}" width="${d.size}" height="${d.size}" fill="rgba(255,255,255,0.7)"/>`;
                });

                // SVG Texte
                const transform = `translate(${w/2 + placement}, ${h/2}) matrix(1, 0, ${skew}, 1, 0, 0)`;
                svgContent += `<g transform="${transform}" font-family="${font}, sans-serif" font-size="${fontSize}px" font-weight="bold" fill="${useStroke ? 'none' : '#FFFFFF'}" stroke="${useStroke ? '#FFFFFF' : 'none'}" stroke-width="2" text-anchor="middle" dominant-baseline="central">`;
                
                currentDrawData.chars.forEach(c => {
                    svgContent += `<text x="${c.x}" y="${c.y}">${c.char}</text>`;
                });
                svgContent += `</g></svg>`;

                const blob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'captcha.svg';
                link.click();
            }
        });

        // --- GESTION DU BOUTON "VAS-Y" (ALÉATOIRE) ---
        document.getElementById('randomBtn').addEventListener('click', () => {
            // Choix aléatoire d'une police
            const randomFont = googleFonts[Math.floor(Math.random() * googleFonts.length)];
            document.getElementById('fontStyle').value = randomFont;

            // Aléatoire sur les curseurs
            document.getElementById('skew').value = (Math.random() * 2 - 1).toFixed(2); // entre -1 et 1
            document.getElementById('scale').value = (Math.random() * 1.5 + 0.5).toFixed(1); // entre 0.5 et 2.0
            document.getElementById('placement').value = Math.floor(Math.random() * 100 - 50); // entre -50 et 50
            document.getElementById('warp').value = Math.floor(Math.random() * 30);
            document.getElementById('extrude').value = Math.random() > 0.7 ? Math.floor(Math.random() * 10) : 0; // 30% de chance d'avoir de la 3D
            
            document.getElementById('lineDensity').value = Math.floor(Math.random() * 30);
            document.getElementById('dotDensity').value = Math.floor(Math.random() * 150);
            document.getElementById('noiseIntensity').value = Math.floor(Math.random() * 50);
            
            useStroke = Math.random() > 0.7; // 30% de chance d'être en contour vide

            // Charger la nouvelle police puis dessiner
            loadGoogleFont(randomFont, renderCaptcha);
        });

        // Toggle Style
        document.getElementById('toggleStyleBtn').addEventListener('click', () => {
            useStroke = !useStroke;
            renderCaptcha();
        });

        // Event listeners pour les inputs
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => { input.addEventListener('input', renderCaptcha); });
        fontSelect.addEventListener('change', (e) => {
            loadGoogleFont(e.target.value, renderCaptcha);
        });

        // Initialisation
        loadGoogleFont(fontSelect.value, renderCaptcha);
    </script>
</body>
</html>
