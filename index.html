<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha's Club Generator</title>
    <!-- Importation des polices -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #1100FF;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--blue);
            color: var(--white);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- SIDEBAR GAUCHE (Réglages) --- */
        .sidebar {
            width: 320px;
            background-color: var(--blue);
            border-right: 2px solid var(--white);
            padding: 20px;
            overflow-y: auto;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .sidebar::-webkit-scrollbar { width: 6px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--white); }

        .section-title {
            background-color: var(--white);
            color: var(--blue);
            padding: 5px 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: inline-block;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 12px;
        }

        label {
            color: var(--white);
            font-size: 0.75rem;
            font-weight: 400;
            opacity: 0.9;
            display: flex;
            justify-content: space-between;
        }

        input[type="text"], select {
            padding: 6px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 3px;
            color: var(--white);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }
        
        input[type="text"]:focus, select:focus {
            border-color: var(--white);
        }

        select option {
            background-color: var(--blue);
            color: var(--white);
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            background: var(--white);
            cursor: pointer;
            margin-top: -4px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 3px;
            cursor: pointer;
            background: rgba(255,255,255,0.3);
        }

        .btn-toggle {
            background-color: transparent;
            color: var(--white);
            border: 1px solid var(--white);
            padding: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
        }
        .btn-toggle:hover {
            background-color: var(--white);
            color: var(--blue);
        }

        /* --- CONTENU PRINCIPAL DROITE --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px;
        }

        .site-title {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2.5rem;
            font-family: 'VT323', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
        }

        .canvas-container {
            margin-bottom: 30px;
        }

        canvas {
            background-color: var(--white); /* FOND BLANC */
            border: 2px solid var(--white); /* Bordure blanche pour se fondre ou contraster */
            max-width: 100%;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.2);
        }

        /* --- BARRE D'ACTIONS --- */
        .action-bar {
            display: flex;
            gap: 15px;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .action-group {
            display: flex;
            gap: 5px;
            align-items: center;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 15px;
        }

        .action-group:last-child { border: none; padding-right: 0; }

        .btn-primary {
            background-color: var(--white);
            color: var(--blue);
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
            transition: transform 0.1s;
        }
        .btn-primary:active { transform: scale(0.95); }

        .btn-vasy {
            background-color: transparent;
            color: var(--white);
            border: 2px solid var(--white);
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .btn-vasy:hover {
            background-color: var(--white);
            color: var(--blue);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <!-- Base -->
        <div>
            <div class="section-title">Base</div>
            <div class="control-group">
                <label>Texte</label>
                <input type="text" id="textInput" value="gAvTyG5" maxlength="8">
            </div>
            <div class="control-group">
                <label>Police Google</label>
                <select id="fontStyle"></select>
            </div>
            <div class="control-group">
                <button class="btn-toggle" id="toggleStyleBtn">Style : Rempli</button>
            </div>
        </div>

        <!-- Positionnement -->
        <div>
            <div class="section-title">Positionnement</div>
            <div class="control-group"><label>Position X</label><input type="range" id="posX" min="-100" max="100" value="0"></div>
            <div class="control-group"><label>Position Y</label><input type="range" id="posY" min="-50" max="50" value="0"></div>
            <div class="control-group"><label>Espacement Lettres</label><input type="range" id="letterSpacing" min="-20" max="50" value="5"></div>
        </div>

        <!-- Distorsion -->
        <div>
            <div class="section-title">Distorsion & Étirement</div>
            <div class="control-group"><label>Échelle Globale</label><input type="range" id="scale" min="0.5" max="2.5" step="0.1" value="1.2"></div>
            <div class="control-group"><label>Étirer Largeur (X)</label><input type="range" id="scaleX" min="0.3" max="3" step="0.1" value="1"></div>
            <div class="control-group"><label>Étirer Hauteur (Y)</label><input type="range" id="scaleY" min="0.3" max="3" step="0.1" value="1"></div>
            <div class="control-group"><label>Inclinaison H (Skew X)</label><input type="range" id="skewX" min="-1.5" max="1.5" step="0.1" value="0.2"></div>
            <div class="control-group"><label>Inclinaison V (Skew Y)</label><input type="range" id="skewY" min="-1.5" max="1.5" step="0.1" value="0"></div>
        </div>

        <!-- Chaos & Effets -->
        <div>
            <div class="section-title">Chaos & Effets</div>
            <div class="control-group"><label>Rotation Aléatoire</label><input type="range" id="randomRot" min="0" max="90" value="15"></div>
            <div class="control-group"><label>Amplitude Vague</label><input type="range" id="waveAmp" min="0" max="40" value="10"></div>
            <div class="control-group"><label>Fréquence Vague</label><input type="range" id="waveFreq" min="0" max="5" step="0.1" value="1.5"></div>
            <div class="control-group"><label>Flou (Blur)</label><input type="range" id="blur" min="0" max="10" step="0.5" value="0"></div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <h1 class="site-title">captcha's club</h1>
        
        <div class="canvas-container">
            <canvas id="captchaCanvas" width="500" height="180"></canvas>
        </div>

        <!-- ACTIONS -->
        <div class="action-bar">
            <div class="action-group">
                <select id="exportFormat" style="width: auto; padding: 10px;">
                    <option value="png">PNG</option>
                    <option value="jpeg">JPEG</option>
                    <option value="svg">SVG</option>
                </select>
                <button class="btn-primary" id="exportBtn">Exporter</button>
            </div>
            <div class="action-group">
                <button class="btn-vasy" id="randomBtn">Vas-y 🎲</button>
            </div>
        </div>
    </main>

    <script>
        const canvas = document.getElementById('captchaCanvas');
        const ctx = canvas.getContext('2d');
        let useStroke = false;
        let currentDrawData = {}; // Pour l'export SVG

        const googleFonts = [
            "VT323", "Inter", "Roboto", "Montserrat", "Oswald", "Playfair Display", 
            "Bebas Neue", "Dancing Script", "Pacifico", "Anton", "Righteous", 
            "Lobster", "Creepster", "Special Elite", "Monoton", "Orbitron", "Nosifer",
            "Shadows Into Light", "Amatic SC", "Indie Flower", "Caveat"
        ];

        const fontSelect = document.getElementById('fontStyle');
        googleFonts.forEach(font => {
            let option = document.createElement('option');
            option.value = font;
            option.textContent = font;
            fontSelect.appendChild(option);
        });

        function loadGoogleFont(fontName, callback) {
            const fontId = 'font-' + fontName.replace(/\s+/g, '-').toLowerCase();
            if (!document.getElementById(fontId)) {
                const link = document.createElement('link');
                link.id = fontId;
                link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}&display=swap`;
                document.head.appendChild(link);
                document.fonts.load(`16px "${fontName}"`).then(() => callback());
            } else {
                callback();
            }
        }

        function renderCaptcha() {
            const text = document.getElementById('textInput').value || " ";
            const font = document.getElementById('fontStyle').value;
            
            // Récupération des curseurs
            const posX = parseFloat(document.getElementById('posX').value);
            const posY = parseFloat(document.getElementById('posY').value);
            const letterSpacing = parseFloat(document.getElementById('letterSpacing').value);
            
            const scale = parseFloat(document.getElementById('scale').value);
            const scaleX = parseFloat(document.getElementById('scaleX').value);
            const scaleY = parseFloat(document.getElementById('scaleY').value);
            const skewX = parseFloat(document.getElementById('skewX').value);
            const skewY = parseFloat(document.getElementById('skewY').value);
            
            const randomRot = parseFloat(document.getElementById('randomRot').value);
            const waveAmp = parseFloat(document.getElementById('waveAmp').value);
            const waveFreq = parseFloat(document.getElementById('waveFreq').value);
            const blur = parseFloat(document.getElementById('blur').value);

            // Préparation de la sauvegarde SVG
            currentDrawData = { 
                text, font, blur, useStroke, chars: [] 
            };

            // Nettoyage fond (Fond BLANC)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFFFFF'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Application du filtre flou
            ctx.filter = `blur(${blur}px)`;

            // Configuration Typographique (Couleur BLEU)
            ctx.save();
            const fontSize = 50 * scale;
            ctx.font = `bold ${fontSize}px "${font}", sans-serif`;
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillStyle = '#1100FF'; 
            ctx.strokeStyle = '#1100FF';
            ctx.lineWidth = 3;

            // Calcul de la largeur totale pour centrer proprement
            let totalWidth = 0;
            let charWidths = [];
            for(let i = 0; i < text.length; i++) {
                let w = ctx.measureText(text[i]).width;
                charWidths.push(w);
                totalWidth += w;
            }
            totalWidth += (text.length - 1) * letterSpacing;

            let startX = (canvas.width - totalWidth) / 2 + posX;

            // Rendu Lettre par Lettre
            for(let i = 0; i < text.length; i++) {
                ctx.save();
                
                // Position de la lettre (Incluant l'onde / vague)
                let x = startX + charWidths[i] / 2;
                let y = (canvas.height / 2) + posY + Math.sin(i * waveFreq) * waveAmp;
                
                ctx.translate(x, y);
                
                // Étirement et Inclinaison
                ctx.transform(scaleX, skewY, skewX, scaleY, 0, 0); 
                
                // Rotation aléatoire de la lettre courante
                let currentRot = (Math.random() * randomRot * 2 - randomRot) * (Math.PI / 180);
                ctx.rotate(currentRot);
                
                // Dessin
                if(useStroke) { ctx.strokeText(text[i], 0, 0); } 
                else { ctx.fillText(text[i], 0, 0); }
                
                // Sauvegarde pour SVG (les matrices SVG sont un peu complexes, on sauvegarde les params basiques)
                currentDrawData.chars.push({ 
                    char: text[i], x: x, y: y, 
                    sx: scaleX, sy: scaleY, skX: skewX, skY: skewY, rot: currentRot 
                });

                ctx.restore();
                
                // Avancer pour la prochaine lettre
                startX += charWidths[i] + letterSpacing;
            }

            ctx.restore();
            ctx.filter = 'none'; // Réinitialisation du filtre
        }

        // --- GESTION DU BOUTON "VAS-Y" (ALÉATOIRE COMPLET) ---
        document.getElementById('randomBtn').addEventListener('click', () => {
            const randomFont = googleFonts[Math.floor(Math.random() * googleFonts.length)];
            document.getElementById('fontStyle').value = randomFont;

            document.getElementById('posX').value = Math.floor(Math.random() * 60 - 30);
            document.getElementById('posY').value = Math.floor(Math.random() * 40 - 20);
            document.getElementById('letterSpacing').value = Math.floor(Math.random() * 40 - 10);
            
            document.getElementById('scale').value = (Math.random() * 1.5 + 0.8).toFixed(1);
            document.getElementById('scaleX').value = (Math.random() * 1.5 + 0.5).toFixed(1);
            document.getElementById('scaleY').value = (Math.random() * 1.5 + 0.5).toFixed(1);
            document.getElementById('skewX').value = (Math.random() * 2 - 1).toFixed(2);
            document.getElementById('skewY').value = (Math.random() * 1 - 0.5).toFixed(2);
            
            document.getElementById('randomRot').value = Math.floor(Math.random() * 45);
            document.getElementById('waveAmp').value = Math.floor(Math.random() * 30);
            document.getElementById('waveFreq').value = (Math.random() * 3).toFixed(1);
            document.getElementById('blur').value = Math.random() > 0.6 ? (Math.random() * 3).toFixed(1) : 0; // Parfois flou

            useStroke = Math.random() > 0.8;
            document.getElementById('toggleStyleBtn').textContent = useStroke ? "Style : Contour" : "Style : Rempli";

            loadGoogleFont(randomFont, renderCaptcha);
        });

        // --- EXPORT ---
        document.getElementById('exportBtn').addEventListener('click', () => {
            const format = document.getElementById('exportFormat').value;
            
            if (format === 'png' || format === 'jpeg') {
                const link = document.createElement('a');
                link.download = `captcha.${format}`;
                link.href = canvas.toDataURL(`image/${format}`, 1.0);
                link.click();
            } else if (format === 'svg') {
                const w = canvas.width; const h = canvas.height;
                const fontSize = 50 * parseFloat(document.getElementById('scale').value);
                
                let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
                    <defs>
                        <filter id="blurFilter">
                            <feGaussianBlur in="SourceGraphic" stdDeviation="${currentDrawData.blur}" />
                        </filter>
                    </defs>
                    <rect width="100%" height="100%" fill="#FFFFFF"/>
                    <g filter="${currentDrawData.blur > 0 ? 'url(#blurFilter)' : 'none'}" font-family="${currentDrawData.font}, sans-serif" font-size="${fontSize}px" font-weight="bold" fill="${currentDrawData.useStroke ? 'none' : '#1100FF'}" stroke="${currentDrawData.useStroke ? '#1100FF' : 'none'}" stroke-width="3" text-anchor="middle" dominant-baseline="central">`;
                
                currentDrawData.chars.forEach(c => {
                    // Construction de la matrice de transformation pour SVG : matrix(a, b, c, d, e, f)
                    // a=scaleX, b=skewY, c=skewX, d=scaleY, e=tx, f=ty
                    let deg = c.rot * (180 / Math.PI);
                    svgContent += `<text transform="translate(${c.x}, ${c.y}) matrix(${c.sx}, ${c.skY}, ${c.skX}, ${c.sy}, 0, 0) rotate(${deg})">${c.char}</text>`;
                });
                svgContent += `</g></svg>`;

                const blob = new Blob([svgContent], {type: 'image/svg+xml;charset=utf-8'});
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = 'captcha.svg';
                link.click();
            }
        });

        // Toggle Style
        const toggleBtn = document.getElementById('toggleStyleBtn');
        toggleBtn.addEventListener('click', () => {
            useStroke = !useStroke;
            toggleBtn.textContent = useStroke ? "Style : Contour" : "Style : Rempli";
            renderCaptcha();
        });

        // Event listeners (sliders)
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => { input.addEventListener('input', renderCaptcha); });
        fontSelect.addEventListener('change', (e) => {
            loadGoogleFont(e.target.value, renderCaptcha);
        });

        // Initialisation
        loadGoogleFont(fontSelect.value, renderCaptcha);
    </script>
</body>
</html>
